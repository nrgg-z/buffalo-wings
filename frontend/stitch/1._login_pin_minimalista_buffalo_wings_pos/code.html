"letterSpacing": "-0.01em", "fontWeight": "400" } ], "headline-sm": [ "36px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "700" } ], "category-item": [ "13px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "400" } ] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased select-none"><main class="w-full min-h-screen flex items-center justify-center p-margin bg-surface"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-48px)] py-4 select-none">
<!-- Tarjeta Central de Terminal POS -->
<div class="w-full max-w-sm sm:max-w-md mx-auto flex flex-col items-center bg-surface-container-lowest p-6 sm:p-8 rounded-xl shadow-xl relative overflow-hidden">
<!-- Sticker de Estado del Terminal / Turno -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-body-md text-body-md mb-6">
<span class="w-2 h-2 rounded-full bg-bw-forest animate-pulse"></span>
<span class="font-medium tracking-tight">Terminal 04 • Salón Principal</span>
</div>
<!-- Título y Subtexto del Operador -->
<div class="text-center mb-6">
<h1 class="font-headline-sm text-headline-sm uppercase text-on-surface tracking-tight mb-1">
        Ingresa tu PIN
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant font-medium">
        Usuario: <span class="font-bold text-on-surface">Nelson G.</span> • Mesero
      </p>
</div>
<!-- 4 Indicadores Circulares de PIN (Dots) -->
<div aria-label="PIN actual" class="flex items-center justify-center gap-4 mb-8" id="pin-dots-container" role="status">
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200" id="dot-0"></div>
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200" id="dot-1"></div>
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200" id="dot-2"></div>
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200" id="dot-3"></div>
</div>
<!-- Teclado Numérico Táctil Ergonómico (3x4 Grid) -->
<div class="grid grid-cols-3 gap-3 w-full max-w-xs" id="keypad">
<!-- Fila 1 -->
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="1" type="button">
        1
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="2" type="button">
        2
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="3" type="button">
        3
      </button>
<!-- Fila 2 -->
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="4" type="button">
        4
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="5" type="button">
        5
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="6" type="button">
        6
      </button>
<!-- Fila 3 -->
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="7" type="button">
        7
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="8" type="button">
        8
      </button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="9" type="button">
        9
      </button>
<!-- Fila 4: Borrar, 0, Entrar -->
<button class="h-16 rounded-xl bg-surface-container-high active:bg-surface-dim text-on-surface flex flex-col items-center justify-center shadow-sm transition-transform active:scale-95" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-[26px]">backspace</span>
<span class="font-nav-link text-nav-link uppercase mt-0.5 tracking-wider">Borrar</span>
</button>
<button class="key-btn h-16 rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm transition-transform active:scale-95" data-key="0" type="button">
        0
      </button>
<button class="h-16 rounded-xl bg-bw-orange active:bg-bw-orange-deep text-bw-white flex flex-col items-center justify-center shadow-md transition-transform active:scale-95" id="btn-submit" type="button">
<span class="material-symbols-outlined text-[26px]">login</span>
<span class="font-nav-link text-nav-link uppercase font-bold mt-0.5 tracking-wider">Entrar</span>
</button>
</div>
<!-- Mensaje de Feedback Operativo Rápido -->
<div class="h-6 mt-6 flex items-center justify-center font-body-md text-body-md text-error opacity-0 transition-opacity" id="auth-feedback">
<span>PIN incorrecto. Intenta de nuevo.</span>
</div>
<!-- Selector Rápido de Colaborador (Modo Tablet Compartida) -->
<div class="w-full mt-2 pt-4 flex items-center justify-between text-on-surface-variant font-body-md text-body-md">
<button class="flex items-center gap-1 hover:text-on-surface transition-colors py-1 px-2 rounded-lg bg-surface-container-low" type="button">
<span class="material-symbols-outlined text-[18px]">switch_account</span>
<span>Cambiar Usuario</span>
</button>
<button class="flex items-center gap-1 hover:text-on-surface transition-colors py-1 px-2 rounded-lg bg-surface-container-low" type="button">
<span class="material-symbols-outlined text-[18px]">help_outline</span>
<span>Asistencia</span>
</button>
</div>
</div>
<!-- Identificador Discreto del POS -->
<div class="mt-4 flex items-center gap-2 text-on-surface-variant font-label-sm text-label-sm tracking-widest uppercase opacity-60">
<span>Buffalo Wings POS</span>
<span>•</span>
<span>v4.18.2</span>
<span>•</span>
<span>Sync OK</span>
</div>
</div>
<script>
  (function() {
    let pin = '';
    const maxDigits = 4;
    const dots = [
      document.getElementById('dot-0'),
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3')
    ];
    const feedback = document.getElementById('auth-feedback');
    const container = document.getElementById('pin-dots-container');

    function updateDots() {
      dots.forEach((dot, index) => {
        if (index < pin.length) {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-bw-orange scale-110 shadow-sm transition-all duration-150';
        } else {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-150';
        }
      });
      if (feedback.classList.contains('opacity-100')) {
        feedback.classList.remove('opacity-100');
        feedback.classList.add('opacity-0');
      }
    }

    function addDigit(digit) {
      if (pin.length < maxDigits) {
        pin += digit;
        updateDots();
        if (pin.length === maxDigits) {
          // Auto submit con leve feedback visual
          setTimeout(verifyPin, 180);
        }
      }
    }

    function removeDigit() {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        updateDots();
      }
    }

    function verifyPin() {
      if (pin.length < maxDigits) {
        return;
      }
      
      // Simulación de acceso exitoso si PIN = '1234' o genérico
      if (pin === '1234' || pin === '0000') {
        dots.forEach(dot => {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-bw-forest scale-110 shadow-sm transition-all duration-150';
        });
        feedback.textContent = 'Acceso concedido. Abriendo comanda...';
        feedback.className = 'h-6 mt-6 flex items-center justify-center font-body-md text-body-md text-bw-forest opacity-100 transition-opacity font-bold';
      } else {
        // Animación de error
        container.classList.add('translate-x-[-6px]');
        setTimeout(() => container.classList.remove('translate-x-[-6px]'), 75);
        setTimeout(() => container.classList.add('translate-x-[6px]'), 150);
        setTimeout(() => container.classList.remove('translate-x-[6px]'), 225);

        dots.forEach(dot => {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-error scale-110 shadow-sm transition-all duration-150';
        });
        feedback.textContent = 'PIN incorrecto. Intenta de nuevo.';
        feedback.className = 'h-6 mt-6 flex items-center justify-center font-body-md text-body-md text-error opacity-100 transition-opacity font-medium';
        
        setTimeout(() => {
          pin = '';
          updateDots();
        }, 800);
      }
    }

    // Teclado en pantalla
    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const key = btn.getAttribute('data-key');
        if (key) addDigit(key);
      });
    });

    document.getElementById('btn-backspace').addEventListener('click', (e) => {
      e.preventDefault();
      removeDigit();
    });

    document.getElementById('btn-submit').addEventListener('click', (e) => {
      e.preventDefault();
      verifyPin();
    });

    // Soporte para teclado físico en tablets con dock o PCs POS
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        addDigit(e.key);
      } else if (e.key === 'Backspace') {
        removeDigit();
      } else if (e.key === 'Enter') {
        verifyPin();
      }
    });
  })();
</script></main></body></html>
